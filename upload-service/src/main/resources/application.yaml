spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/upload_platform
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: upload-service

storage:
  root-path: C:/uploads
  max-file-size: 104857600
