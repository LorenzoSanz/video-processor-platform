spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upload_platform}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:password}"
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 100MB      # Tomcat size limit
      max-request-size: 105MB  

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: upload-service

storage:
  root-path: "${STORAGE_ROOT_PATH:C:/uploads}"
  max-file-size: 104857600

messaging:
  sqs:
    enabled: ${SQS_ENABLED:false}
    endpoint: "${SQS_ENDPOINT:}"
    queue-url: "${SQS_QUEUE_URL:}"
    region: "${AWS_REGION:eu-west-1}"
    access-key: "${SQS_ACCESS_KEY:}"
    secret-key: "${SQS_SECRET_KEY:}"

outbox:
  publisher:
    scheduling-enabled: ${OUTBOX_PUBLISHER_SCHEDULING_ENABLED:false}
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:10}
    fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
    lease-duration-seconds: ${OUTBOX_PUBLISHER_LEASE_DURATION_SECONDS:30}  